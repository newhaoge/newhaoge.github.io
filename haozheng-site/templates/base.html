<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical_url}}">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="{{name}}">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical_url}}">
<meta property="og:image" content="{{base_url}}/{{photo}}">
<meta property="og:image:alt" content="Portrait of {{name}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{base_url}}/{{photo}}">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FWJ2TZ58WX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FWJ2TZ58WX');
</script>
<link rel="icon" type="image/png" href="assets/img/ucf-tab.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img class="ucf-logo" src="assets/img/ucf-tab.png" width="332" height="448" alt="UCF">
      <span class="name">{{name}}</span>
    </a>
    <nav class="nav" aria-label="Primary">
{{nav}}
    </nav>
    <a class="mailto" href="mailto:{{email}}">{{email}}</a>
  </div>
</header>

<main id="main">
{{content}}
</main>

<footer class="site-footer" id="contact">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <h2>Contact</h2>
        <a class="bigmail" href="mailto:{{email}}">{{email}}</a>
      </div>
      <div>
        <h2>Office</h2>
        <address>
{{address}}
          <a href="{{map_url}}">Open in Maps</a>
        </address>
      </div>
      <div>
        <h2>Elsewhere</h2>
        <ul class="footlinks">
{{elsewhere}}
        </ul>
      </div>
      <div>
        <h2>Prospective students</h2>
        <p style="margin:0;font-size:15px">{{footer_note}}</p>
      </div>
    </div>
    <div class="colophon">
      <span>&copy; {{year}} {{name}}</span>
      <span>{{colophon}}</span>
    </div>
  </div>
</footer>

{{scripts}}
</body>
</html>
